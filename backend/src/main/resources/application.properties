spring.application.name=slotmind
spring.config.import=optional:classpath:application-local.properties

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:h2:mem:slotmind;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always

spring.mvc.async.request-timeout=120000

slotmind.cors.allowed-origins=http://localhost:5173

slotmind.scheduling.strategy=AI
slotmind.ai.provider=litellm
slotmind.ai.base-url=https://litellm-qc.zycus.net/v1
slotmind.ai.model=qwen-cursor
slotmind.ai.api-key=${SLOTMIND_AI_API_KEY:}
slotmind.ai.headers.product=PC1
slotmind.ai.timeout-seconds=15

logging.level.com.slotmind=INFO
